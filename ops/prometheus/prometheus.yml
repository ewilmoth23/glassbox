# Glassbox Prometheus scrape config
# ─────────────────────────────────────────────────────────────────────
# Drop-in config for the docker-compose stack in this directory.
# Two scrape jobs:
#   1. glassbox-prefilter — the new /api/v1/metrics/prefilter shim
#      (8 metric families: pass/drop/queue/priority/shadow).
#   2. glassbox-server — the existing /api/v1/metrics endpoint (db
#      pool + per-ingester health, hand-rolled exposition).
#
# The host.docker.internal name resolves to the Mac host from inside
# Docker on macOS, so the daemon doesn't need to bind to all
# interfaces.

global:
  scrape_interval: 30s
  scrape_timeout:  10s
  evaluation_interval: 30s
  external_labels:
    cluster: mewr-mac-mini
    environment: prod

scrape_configs:
  - job_name: glassbox-prefilter
    metrics_path: /api/v1/metrics/prefilter
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:8790']
        labels:
          service: glassbox-server
          subsystem: prefilter

  - job_name: glassbox-server
    metrics_path: /api/v1/metrics
    scrape_interval: 60s
    static_configs:
      - targets: ['host.docker.internal:8790']
        labels:
          service: glassbox-server
          subsystem: ingester-health

  # Self-scrape — verify the Prometheus container itself is healthy.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
