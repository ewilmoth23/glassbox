# ═══════════════════════════════════════════════════════════════════════════
# GLASSBOX SOURCES INVENTORY — the operational license/ToS gate
# ═══════════════════════════════════════════════════════════════════════════
#
# Every ingester MUST have an entry here. Backend at startup:
#   1. Refuses to start any ingester missing an entry
#   2. Refuses to start any ingester where enabled: false
#   3. For v1.0: refuses to start any ingester where commercial_use_ok: false
#
# This file is also the FRONTEND attribution source — the UI footer reads
# this to render "Data sources: ..." with proper credit.
#
# When adding a new ingester:
#   1. Read LEGAL_COMPLIANCE_REGISTRY.md Chapters 1, 2, 3 first
#   2. Check the source against Chapter 2 NEVER-USE list
#   3. Add an entry here with HONEST values for every field
#   4. Get sign-off (your own, in single-dev mode) that no Vector #1-#12 risk
#   5. Then write the ingester
#
# Field reference:
#   id                    — short slug, matches ingester filename
#   name                  — human-readable for UI
#   url                   — base URL or WS endpoint
#   auth                  — none / api_key_env(VAR) / oauth2_client_credentials_env(...) / etc.
#   license               — short tag — see LEGAL_COMPLIANCE_REGISTRY Chapter 3
#   license_url           — link to upstream's license/ToS
#   attribution           — EXACT text to render in UI when this source contributes
#   redistributable       — can we re-emit raw records to consumers via firehose?
#   pii_level             — none / low / medium / high
#   fcra_safe             — can be used for FCRA-covered decisions? (always false in v1.0)
#   surveillance_prohibited — does source ToS prohibit surveillance use?
#   commercial_use_ok     — free tier explicitly permits commercial use?
#   rate_limit            — human-readable
#   poll_interval_sec     — operational cadence
#   enabled               — false = ingester refuses to start
#   disabled_reason       — text if enabled: false
#   migrate_to_pro        — if enabled: false because of license, true means re-enable in v1.2 Pro
#
# Last reviewed: 2026-05-27 (P2-A Phase 1 MVP — cisa_kev added, spamhaus_drop activated)
# ═══════════════════════════════════════════════════════════════════════════

sources_inventory_version: 1
last_reviewed: '2026-05-27'
last_reviewed_by: 'ethan + claude'

# Operating rules read by the Ingester base class:
operating_rules:
  v1_0_only_commercial_ok: true   # refuse any ingester where commercial_use_ok: false
  refuse_unknown: true            # refuse any ingester not in this file
  log_attribution_misses: true    # warn if frontend renders without attribution string

# IMPORTANT: `enabled: true` is the FORWARD-LOOKING intent (license-OK + we plan
# to ship it in v1.0). Operationally, an ingester is only ACTIVE if BOTH:
#   - sources.yaml row has `enabled: true`
#   - The Python ingester file actually exists in 21_GLASSBOX_AI/ingesters/
#   - The ingester is wired into glassbox_server.py startup
#
# Today's actually-shipped + actually-running ingesters (2026-05-04):
#   - earthquakes (usgs_earthquakes)
#   - gdelt (gdelt)
#   - gdelt_topical (gdelt_topical, shipped 2026-05-03)
#   - planes (CURRENTLY uses OpenSky → MUST refactor to adsb.lol per planes.py
#            migration in Phase 1, before any commercial deployment)
#   - ships (CURRENTLY uses Datalastic → VERIFY commercial terms; if
#           non-commercial, switch to AISStream.io)
#   - satellites (CelesTrak — already free + commercial OK)
#
# Everything else marked `enabled: true` below is on the v1.0 build roadmap.

