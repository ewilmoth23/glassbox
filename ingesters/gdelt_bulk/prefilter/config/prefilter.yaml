# Default GDELT pre-filter config — used by gdelt_bulk.py when it ships.
# Subcategories are the ones the HANDOFF_02 CAMEO lookup actually emits
# (see 21_GLASSBOX_AI/glassbox_taxonomy/data/cameo_lookup.json). Adding
# subcategories not in the lookup is silently a no-op — the CategoryRule
# never sees them — so keep this list synced when the taxonomy changes.

version: "1.0"

rules:
  category_filter:
    mode: allow
    subcategories:
      # Armed conflict — high-severity by design
      - armed_conflict.airstrike
      - armed_conflict.artillery
      - armed_conflict.ground_assault
      - armed_conflict.bombing
      - armed_conflict.suicide_attack
      - armed_conflict.assassination
      - armed_conflict.mass_killing
      - armed_conflict.wmd
      - armed_conflict.occupation
      - armed_conflict.ceasefire_break
      - armed_conflict.blockade
      - armed_conflict.skirmish
      # Posture + threats are intentionally excluded — too noisy in
      # peacetime; analysts can re-enable per region.
      # Civil violence above pure protest
      - violence_civil.riot
      - violence_civil.assault
      - violence_civil.kidnapping
      - violence_civil.repression
      - violence_civil.detention
      # Sanctions & embargo — material economic action
      - economic.sanctions
      - economic.aid_cut
      # Humanitarian crises — refugee, peacekeeping
      - humanitarian.refugee
      - humanitarian.peacekeeping
      - humanitarian.peacekeeping_end
      # Infrastructure attacks
      - infrastructure.property_attack
      # Cyber posture (will expand when the bulk ingester surfaces
      # finer-grained cyber events from GDELT GKG themes)
      - cyber.posture
      # Investigations of war crimes / human rights / military action —
      # signal that something newsworthy already happened
      - governance.investigation
      - governance.judicial
      - governance.leadership_change
    flags_required: []
    flags_blocked: []

  severity_filter:
    min_severity: 0.5
    per_category_overrides:
      diplomatic: 0.85          # only major diplomatic events
      governance: 0.30          # investigations are valuable even at low severity
      cyber: 0.40
      humanitarian: 0.45

  geography_filter:
    precision_min: region       # 'region' = ~50km; matches GDELT's typical ADM1
    bbox_allowlist: []
    iso_country_allowlist: []
    iso_country_blocklist: []

  source_quality_filter:
    min_score: 0.50
    unknown_domain_score: 0.30
    data_file: data/source_quality.json

  recency_filter:
    max_age_hours: 6

  dedup_filter:
    enabled: true
    window_minutes: 60
    similarity_threshold: 0.85
    geo_threshold_km: 50
    fields_compared: ["title", "actor1", "actor2", "subcategory"]

priority:
  weights:
    severity:    0.30
    source:      0.20
    duplication: 0.20
    recency:     0.10
    category:    0.10
    geo_aoi:     0.10
  category_priority_bonuses:
    armed_conflict.wmd: 1.0
    armed_conflict.mass_killing: 0.95
    armed_conflict.assassination: 0.85
    armed_conflict.airstrike: 0.80
    armed_conflict.bombing: 0.80
    armed_conflict.suicide_attack: 0.85
    economic.sanctions: 0.60
    humanitarian.refugee: 0.65
    cyber.posture: 0.50

queue:
  max_depth: 500
  redis_key: glassbox:prefilter:queue

ab_test:
  enabled: false
